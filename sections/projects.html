<!-- Projects Section Template -->

<!-- Project data is rendered dynamically from js/data/projects.js. -->

<section class="section section--alt" id="projects">
    <div class="container">
        <div class="section__header section__header--center" data-animate>
            <h2 class="section-title">Featured Projects</h2>
            <p class="section-subtitle">
                GIS, remote sensing, photogrammetry, and geospatial development work.
            </p>
        </div>

        <!-- Filter buttons — populated by projects.js -->
        <div class="projects__filters" data-animate>
            <!-- Dynamically rendered -->
        </div>

        <!-- Project cards grid — populated by projects.js -->
        <div class="projects__grid" data-animate>
            <!-- Dynamically rendered -->
        </div>
    </div>
</section>
